name: Remove summary closing sentence

on:
  push:
    branches:
      - resume/remove-summary-closing
    paths:
      - ".github/workflows/remove-summary-closing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Remove closing sentence from summary only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("main.js")
          text = path.read_text()
          old = " Developed practical technical documentation, standard operating procedures, and automation to streamline on-site maintenance and end-user support.</p>"
          new = "</p>"
          if old not in text:
              raise SystemExit("Expected summary closing sentence not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Remove closing sentence from professional summary"
          git push origin HEAD:${{ github.ref_name }}
