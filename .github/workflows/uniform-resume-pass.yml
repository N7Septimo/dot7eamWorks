name: Uniform Resume Pass

on:
  push:
    branches:
      - resume/uniformity-pass
    paths:
      - ".github/workflows/uniform-resume-pass.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Run normalization
        run: python scripts/uniform_resume.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js test/main.test.mjs
          git commit -m "Normalize resume structure and bullet rhythm"
          git push origin HEAD:${{ github.ref_name }}
