name: Apply convoy wording

on:
  push:
    branches:
      - resume/convoy-wording
    paths:
      - ".github/workflows/apply-convoy-wording.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply exact resume wording
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("main.js")
          text = main.read_text()
          old = "            <li>Completed 18 months of Army assignments in the Middle East, conducting personnel escort and convoy operations while maintaining communication, accountability, safety, and mission continuity.</li>"
          new = "            <li>Conducted route, personnel, and convoy security operations during an 18-month deployment in the Middle East.</li>"
          if old not in text:
              raise SystemExit("Expected Army deployment bullet not found")
          text = text.replace(old, new, 1)
          text = text.replace('const RELEASE = "2026.09.09.5";', 'const RELEASE = "2026.09.09.6";', 1)
          main.write_text(text)

          tests = Path("test/main.test.mjs")
          text = tests.read_text()
          text = text.replace(
              '  assert.ok(body.includes("18 months of Army assignments in the Middle East"));\n  assert.ok(body.includes("conducting personnel escort and convoy operations"));',
              '  assert.ok(body.includes("Conducted route, personnel, and convoy security operations during an 18-month deployment in the Middle East."));\n  assert.ok(!body.includes("Completed 18 months of Army assignments in the Middle East"));',
              1,
          )
          text = text.replace('    release: "2026.09.09.5",', '    release: "2026.09.09.6",', 1)
          tests.write_text(text)
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js test/main.test.mjs
          git commit -m "Refine Middle East deployment wording"
          git push origin HEAD:${{ github.ref_name }}
